<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ten-Finger Typing Game</title>
<style>
  /* ---- Page layout: center the game on a soft sky background ---- */
  html, body {
    margin: 0;
    height: 100%;
    background: #bfe3ff;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The canvas holds the whole game. Rounded corners + shadow for a friendly card look. */
  #game {
    background: #d6efff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 60, 120, 0.25);
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>

<script>
"use strict";

/* =====================================================================
   Ten-Finger Typing Game
   ---------------------------------------------------------------------
   Words fall from the top. Type a word's FIRST letter to "lock" onto it,
   then type the rest in order to clear it. Words that reach the floor
   cost a life. Each level: words fall faster and grow longer.

   The code is split into 7 clearly-labelled sections so the structure of
   a real-time game loop is easy to follow:
     1) WORD BANK        - the words that can fall
     2) CONFIG + STATE   - all tunable numbers and the live game state
     3) SPAWNING         - making new words appear
     4) INPUT            - keyboard handling (the typing + targeting)
     5) UPDATE           - moving things, one frame of "physics"
     6) RENDER           - drawing everything to the canvas
     7) GAME LOOP        - ties update + render together with timing
   ===================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const FLOOR_Y = H - 60; // the line words must not cross


/* ---------------------------------------------------------------------
   1) WORD BANK
   Kid-friendly lowercase words, grouped by how long they are.
   pickWord(level) chooses which tiers are allowed, biasing toward
   longer words as the level rises.
   --------------------------------------------------------------------- */
const WORDS = {
  short:  ["cat", "dog", "sun", "fox", "bee", "hat", "cup", "fish", "frog", "duck",
           "tree", "star", "moon", "ball", "book", "rain", "milk", "bird", "cake", "kite"],
  medium: ["apple", "happy", "tiger", "smile", "cloud", "horse", "lemon", "grape",
           "river", "panda", "jelly", "candy", "robot", "music", "table", "green"],
  long:   ["rainbow", "elephant", "dinosaur", "computer", "birthday", "sandwich",
           "mountain", "butterfly", "kangaroo", "umbrella", "treasure", "keyboard"],
};

function pickWord(level) {
  // Decide which difficulty tiers are in play for this level.
  let pool = [...WORDS.short];
  if (level >= 3) pool = pool.concat(WORDS.medium);
  if (level >= 5) pool = pool.concat(WORDS.long);
  // (levels 1-2 = short only, 3-4 add medium, 5+ add long)
  return pool[Math.floor(Math.random() * pool.length)];
}


/* ---------------------------------------------------------------------
   2) CONFIG + STATE
   CONFIG = numbers you can tweak to change how the game feels.
   state  = everything that changes while playing.
   --------------------------------------------------------------------- */
const CONFIG = {
  startLives: 3,
  wordsPerLevel: 8,        // clear this many words to advance a level

  baseSpeed: 40,           // fall speed at level 1 (pixels per second)
  speedStep: 12,           // extra speed added per level

  baseSpawn: 2.2,          // seconds between spawns at level 1
  spawnStep: 0.18,         // spawn interval shrinks by this per level
  minSpawn: 0.8,           // never spawn faster than this
};

let state;

function newGame() {
  state = {
    status: "start",       // "start" | "playing" | "gameover"
    score: 0,
    lives: CONFIG.startLives,
    level: 1,
    wordsCleared: 0,
    words: [],             // active falling words
    target: null,          // the word currently being typed (or null)
    particles: [],         // little burst dots when a word is cleared
    spawnTimer: 0,         // counts up; spawns a word when it passes the interval
  };
}
newGame();

// Speed + spawn interval are derived from the current level.
function fallSpeed() {
  return CONFIG.baseSpeed + (state.level - 1) * CONFIG.speedStep;
}
function spawnInterval() {
  return Math.max(CONFIG.minSpawn, CONFIG.baseSpawn - (state.level - 1) * CONFIG.spawnStep);
}

// A cheerful palette; each word picks one colour for its pill.
const PILL_COLORS = ["#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc", "#f783ac"];


/* ---------------------------------------------------------------------
   3) SPAWNING
   Create one new falling word at a random x near the top.
   --------------------------------------------------------------------- */
function spawnWord() {
  const text = pickWord(state.level);
  ctx.font = "bold 28px 'Trebuchet MS', sans-serif";
  const padding = 22;
  const width = ctx.measureText(text).width + padding * 2;
  const maxX = W - width - 10;
  const x = 10 + Math.random() * Math.max(0, maxX - 10);

  state.words.push({
    text: text,
    typed: 0,                 // how many letters have been typed correctly
    x: x,                     // left edge of the pill
    y: -20,                   // start just above the screen
    width: width,
    speed: fallSpeed(),
    color: PILL_COLORS[Math.floor(Math.random() * PILL_COLORS.length)],
    shake: 0,                 // >0 briefly after a wrong key, for a wobble
  });
}


/* ---------------------------------------------------------------------
   4) INPUT
   One keydown listener handles every screen.
   --------------------------------------------------------------------- */
window.addEventListener("keydown", (e) => {
  // Start / restart screens: Enter or Space begins the game.
  if (state.status === "start" || state.status === "gameover") {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      const wasOver = state.status === "gameover";
      if (wasOver) newGame();
      state.status = "playing";
    }
    return;
  }

  // While playing we only care about single letters a-z.
  if (state.status !== "playing") return;
  if (e.key.length !== 1) return;
  const key = e.key.toLowerCase();
  if (key < "a" || key > "z") return;

  // No word locked yet: try to lock onto a word whose FIRST letter matches.
  if (!state.target) {
    let best = null;
    for (const word of state.words) {
      if (word.text[0] === key) {
        // Prefer the lowest word (closest to the floor = most urgent).
        if (!best || word.y > best.y) best = word;
      }
    }
    if (best) {
      best.typed = 1;
      state.target = best;
    }
    return;
  }

  // A word is locked: the key must be its next expected letter.
  const t = state.target;
  if (t.text[t.typed] === key) {
    t.typed++;
    if (t.typed >= t.text.length) {
      clearWord(t);            // finished the whole word!
    }
  } else {
    // Wrong key: forgiving. No progress lost, just a little wobble.
    t.shake = 0.3;
  }
});

// Remove a completed word, score it, and throw a burst of particles.
function clearWord(word) {
  state.score++;
  state.wordsCleared++;
  burst(word.x + word.width / 2, word.y, word.color);

  state.words = state.words.filter((w) => w !== word);
  if (state.target === word) state.target = null;

  // Level up every N cleared words.
  if (state.wordsCleared % CONFIG.wordsPerLevel === 0) {
    state.level++;
  }
}

// Spawn ~16 coloured dots that fly outward and fade — the "pop".
function burst(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const angle = (Math.PI * 2 * i) / 16;
    const speed = 80 + Math.random() * 120;
    state.particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.6,            // seconds until gone
      color: color,
    });
  }
}


/* ---------------------------------------------------------------------
   5) UPDATE  — one frame of "what changes": dt = seconds since last frame
   --------------------------------------------------------------------- */
function update(dt) {
  if (state.status !== "playing") return;

  // Spawn timer.
  state.spawnTimer += dt;
  if (state.spawnTimer >= spawnInterval()) {
    state.spawnTimer = 0;
    spawnWord();
  }

  // Move words down. If one crosses the floor, it costs a life.
  const survivors = [];
  for (const word of state.words) {
    word.y += word.speed * dt;
    if (word.shake > 0) word.shake = Math.max(0, word.shake - dt);

    if (word.y >= FLOOR_Y) {
      state.lives--;
      if (state.target === word) state.target = null;
      burst(word.x + word.width / 2, FLOOR_Y, "#ff8787");
      if (state.lives <= 0) {
        state.status = "gameover";
      }
    } else {
      survivors.push(word);
    }
  }
  state.words = survivors;

  // Advance particles and drop the dead ones.
  for (const p of state.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;        // a little gravity
    p.life -= dt;
  }
  state.particles = state.particles.filter((p) => p.life > 0);
}


/* ---------------------------------------------------------------------
   6) RENDER — draw the current state. Pure drawing, no game logic.
   --------------------------------------------------------------------- */
function render() {
  // Sky gradient background.
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#d6efff");
  sky.addColorStop(1, "#a5d8ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Grassy floor strip.
  ctx.fillStyle = "#8ce99a";
  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  ctx.fillStyle = "#69db7c";
  ctx.fillRect(0, FLOOR_Y, W, 6);

  // Falling words.
  for (const word of state.words) drawWord(word);

  // Particles.
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD on top of everything while playing.
  if (state.status === "playing") drawHUD();

  // Overlays for the start and game-over screens.
  if (state.status === "start") drawStartScreen();
  if (state.status === "gameover") drawGameOver();
}

function drawWord(word) {
  ctx.font = "bold 28px 'Trebuchet MS', sans-serif";
  const isTarget = state.target === word;
  const h = 44;
  // Wobble offset when a wrong key was just pressed.
  const wob = word.shake > 0 ? Math.sin(word.shake * 60) * 4 : 0;
  const x = word.x + wob;
  const y = word.y;

  // Pill background.
  roundRect(x, y, word.width, h, 14);
  ctx.fillStyle = word.color;
  ctx.fill();
  if (isTarget) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#212529";
    ctx.stroke();
  }

  // Text: typed prefix in green, the rest in dark ink.
  const textY = y + h / 2 + 10;
  const startX = x + 22;
  const typed = word.text.slice(0, word.typed);
  const rest = word.text.slice(word.typed);

  ctx.textAlign = "left";
  ctx.fillStyle = "#2b8a3e";          // typed-so-far = green
  ctx.fillText(typed, startX, textY);
  const typedW = ctx.measureText(typed).width;
  ctx.fillStyle = "#212529";          // remaining = dark
  ctx.fillText(rest, startX + typedW, textY);
}

function drawHUD() {
  ctx.textAlign = "left";
  ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#1864ab";
  ctx.fillText("Score: " + state.score, 16, 32);
  ctx.fillText("Level: " + state.level, 16, 60);

  // Hearts on the right.
  ctx.textAlign = "right";
  ctx.font = "22px 'Segoe UI Emoji', sans-serif";
  let hearts = "";
  for (let i = 0; i < state.lives; i++) hearts += "❤️";
  ctx.fillText(hearts || "—", W - 16, 32);
}

function drawStartScreen() {
  dimOverlay();
  ctx.textAlign = "center";
  ctx.fillStyle = "#1864ab";
  ctx.font = "bold 48px 'Trebuchet MS', sans-serif";
  ctx.fillText("Ten-Finger Typing", W / 2, H / 2 - 70);

  ctx.fillStyle = "#212529";
  ctx.font = "22px 'Trebuchet MS', sans-serif";
  ctx.fillText("Type a word's first letter to lock on,", W / 2, H / 2 - 10);
  ctx.fillText("then type the rest before it lands!", W / 2, H / 2 + 22);

  ctx.fillStyle = "#e8590c";
  ctx.font = "bold 26px 'Trebuchet MS', sans-serif";
  ctx.fillText("Press ENTER to start", W / 2, H / 2 + 80);
}

function drawGameOver() {
  dimOverlay();
  ctx.textAlign = "center";
  ctx.fillStyle = "#c92a2a";
  ctx.font = "bold 48px 'Trebuchet MS', sans-serif";
  ctx.fillText("Game Over", W / 2, H / 2 - 50);

  ctx.fillStyle = "#212529";
  ctx.font = "24px 'Trebuchet MS', sans-serif";
  ctx.fillText("Score: " + state.score + "   •   Level reached: " + state.level, W / 2, H / 2 + 5);

  ctx.fillStyle = "#e8590c";
  ctx.font = "bold 26px 'Trebuchet MS', sans-serif";
  ctx.fillText("Press ENTER to play again", W / 2, H / 2 + 70);
}

// --- small drawing helpers ---
function dimOverlay() {
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
  ctx.fillRect(0, 0, W, H);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}


/* ---------------------------------------------------------------------
   7) GAME LOOP
   requestAnimationFrame gives us a timestamp each frame. We turn the
   gap between frames into dt (in seconds) so movement is the same speed
   on every monitor, then run update() and render().
   --------------------------------------------------------------------- */
let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000; // ms -> seconds
  lastTime = timestamp;
  // Guard against big jumps (e.g. tab was in the background).
  if (dt > 0.1) dt = 0.1;

  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
